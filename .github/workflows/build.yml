name: build-apk

on:
  push:
  pull_request:

jobs:
  gradle:
    name: Gradle (Android Studio path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: musicclip-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  offline:
    name: Offline script pipeline (no Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch toolchain pieces not covered by the runner image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # aapt2/d8/apksigner/android.jar come from GitHub mirrors
          tools/fetch_toolchain.sh

      - name: Build signed APK
        run: tools/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: musicclip-offline-apk
          path: dist/*.apk
